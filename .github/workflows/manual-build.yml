name: Manual Android Build

on:
  workflow_dispatch:

concurrency:
  group: samillimed-android-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build, verify and package SamilliMed
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK and accept licenses non-interactively
        shell: bash
        run: |
          set -eu
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          test -d "$SDK_ROOT/cmdline-tools"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER" && test -x "$SDKMANAGER"
          # CI cannot answer sdkmanager's interactive license prompt; supply approvals through stdin.
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.4.0
        with:
          cache-provider: basic

      - name: Build debug APK
        run: bash ./gradlew --no-daemon --warning-mode=all --stacktrace assembleDebug

      - name: Verify APK and prepare single-file package
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          BADGING="$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK")"
          printf '%s\n' "$BADGING" | head -n 1
          printf '%s\n' "$BADGING" | grep -F "package: name='org.samillimed.app'"
          mkdir -p dist
          cp "$APK" dist/SamilliMed.apk
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 1
          test -s dist/SamilliMed.apk

      - name: Upload SamilliMed ZIP containing only SamilliMed.apk
        uses: actions/upload-artifact@v7.0.2
        with:
          name: SamilliMed
          path: dist/SamilliMed.apk
          if-no-files-found: error
          retention-days: 14
