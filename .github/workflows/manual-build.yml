name: Manual Android Build

on:
  workflow_dispatch:

concurrency:
  group: samillimed-android-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and inspect warnings
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK with Android CLI
        uses: premex-ab/setup-android-cli@35c853708c8a6981651bb0060a17e01fac0143b1
        with:
          packages: |
            platform-tools
            platforms/android-37
            build-tools/37.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.4.0
        with:
          cache-provider: basic

      - name: Build debug APK with all warnings visible
        run: ./gradlew --no-daemon --warning-mode=all --stacktrace assembleDebug
