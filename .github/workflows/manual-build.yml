name: Manual Android Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: samillimed-android-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and inspect warnings
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: Set up Gradle 9.8.2
        uses: gradle/actions/setup-gradle@v6.4.0
        with:
          gradle-version: '9.8.2'

      - name: Install stable Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 9.8.2 --distribution-type bin

      - name: Build debug APK with all warnings visible
        run: ./gradlew --no-daemon --warning-mode=all assembleDebug
