name: Manual Android Build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and inspect warnings
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.2'

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager --channel=3 "platforms;android-37" "build-tools;37.0.0"

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 9.8.2 --distribution-type bin

      - name: Save Gradle Wrapper to repository
        run: |
          if [ -n "$(git status --porcelain -- gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar
            git commit -m "build: add Gradle Wrapper scripts"
            git push
          fi

      - name: Build debug APK with all warnings visible
        run: ./gradlew --no-daemon --warning-mode=all assembleDebug
