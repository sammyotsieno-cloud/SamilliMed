name: Manual Android Build

on:
  push:
    branches:
      - main
    paths-ignore:
      - gradlew
      - gradlew.bat
      - gradle/wrapper/gradle-wrapper.jar
  workflow_dispatch:

concurrency:
  group: samillimed-android-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build and inspect warnings
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: Set up Gradle 9.8.2
        uses: gradle/actions/setup-gradle@v6.4.0
        with:
          gradle-version: '9.8.2'

      - name: Install stable Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Generate Gradle Wrapper without configuring the app
        run: |
          mkdir -p "$RUNNER_TEMP/gradle-wrapper"
          cd "$RUNNER_TEMP/gradle-wrapper"
          gradle wrapper --gradle-version 9.8.2 --distribution-type bin
          cp gradlew "$GITHUB_WORKSPACE/gradlew"
          cp gradlew.bat "$GITHUB_WORKSPACE/gradlew.bat"
          cp gradle/wrapper/gradle-wrapper.jar "$GITHUB_WORKSPACE/gradle/wrapper/gradle-wrapper.jar"

      - name: Build debug APK with all warnings visible
        run: ./gradlew --no-daemon --warning-mode=all assembleDebug

      - name: Commit Gradle Wrapper scripts after a successful build
        if: success()
        run: |
          if [ -n "$(git status --porcelain -- gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar
            git commit -m "build: add Gradle Wrapper scripts"
            git push
          fi
