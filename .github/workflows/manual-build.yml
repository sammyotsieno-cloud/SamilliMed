name: Manual Android Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: samillimed-android-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and inspect warnings
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Set up Gradle 9.8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.2'

      - name: Install Android SDK packages
        run: sdkmanager --channel=3 "platforms;android-37" "build-tools;37.0.0"

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 9.8.2 --distribution-type bin

      - name: Build debug APK with all warnings visible
        run: ./gradlew --no-daemon --warning-mode=all assembleDebug
